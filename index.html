<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat IA</title><style>
:root{font-family:system-ui,sans-serif;color:#f7f0ff;background:#100d17}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{display:flex;min-height:100dvh}.sidebar{width:235px;background:#1c1526;padding:15px;display:flex;flex-direction:column;gap:8px}.brand{font-size:24px;font-weight:800;padding:14px 8px 25px}.glass{border:1px solid #ffffff40;border-radius:13px;background:linear-gradient(135deg,#ffffff25,#a96ee320);box-shadow:inset 0 1px #ffffff70,0 5px 17px #0004;backdrop-filter:blur(14px);transition:.2s;position:relative;overflow:hidden}.glass:before,.bubble:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(160px circle at var(--x,50%) var(--y,0%),#ffffff9c,#b980f34a 35%,transparent 70%);opacity:0;transition:.2s}.glass:hover:before,.bubble:hover:before{opacity:1}.glass:hover,.bubble:hover{transform:translateY(-2px);box-shadow:inset 0 1px #fff,0 9px 22px #0008,0 0 17px #b66dff50}.nav{text-align:left;padding:12px}.nav.active{background:linear-gradient(135deg,#9d58ce83,#ffffff1c)}.sidebar .bottom{margin-top:auto;display:grid;gap:8px}.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100dvh;background:radial-gradient(ellipse at 50% 105%,#342044,transparent 65%),#100d17}.top{height:65px;padding:14px 24px;border-bottom:1px solid #ffffff17;font-size:19px;font-weight:700}.content{flex:1;overflow:auto;padding:25px max(20px,9%)}.welcome{margin:14vh auto 0;max-width:550px;text-align:center}.welcome h1{font-size:clamp(25px,4vw,37px)}.muted{color:#cbb6db;font-size:13px}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.suggest button{padding:16px}.composer{padding:12px max(20px,9%) 22px}.entry{border:1px solid #ffffff45;border-radius:18px;background:#ffffff13;padding:12px;box-shadow:inset 0 1px #ffffff60}.entry textarea{display:block;width:100%;min-height:55px;resize:vertical;border:0;outline:0;background:transparent}.actions{display:flex;gap:9px;align-items:center}.actions button{padding:9px 12px}.send{margin-left:auto;background:linear-gradient(135deg,#c88ef8,#783bb1)}.messages{display:flex;flex-direction:column;gap:16px}.bubble{max-width:85%;position:relative;overflow:hidden;border:1px solid #ffffff60;border-radius:20px;padding:15px 18px;line-height:1.55;white-space:pre-wrap;transition:.2s;box-shadow:inset 0 1px #ffffff7a,0 8px 23px #0005}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#c18bf66e,#763ba780)}.bubble.ai{align-self:flex-start;background:linear-gradient(135deg,#ffffff25,#7d4c9d66)}.panel{border:1px solid #ffffff35;background:#ffffff0c;border-radius:17px;padding:20px;margin:15px 0}.panel input{width:100%;padding:12px;margin:8px 0;border:1px solid #ffffff40;border-radius:10px;background:#ffffff13}.panel button{padding:11px 14px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:18px;border:1px solid #ffffff38;border-radius:16px;background:linear-gradient(135deg,#ffffff20,#a968db15)}.metric strong{display:block;font-size:32px;margin:6px 0}.bar{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d4ac0,#dca7ff)}.hidden{display:none!important}.note{font-size:12px;color:#e2bafa}.status{font-size:12px;color:#d7b3f1;min-height:16px}.hist{display:grid;gap:5px}.hist button{background:transparent;border:0;text-align:left;padding:9px;font-size:12px}.hist button:hover{background:#ffffff13;border-radius:8px}@media(max-width:650px){.sidebar{width:138px;padding:8px}.brand{font-size:19px}.nav{font-size:11px;padding:10px 7px}.content{padding:18px}.composer{padding:10px}.metrics{gap:8px}.metric{padding:11px}.metric strong{font-size:23px}.top{padding:15px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Chat IA</div><button class="glass nav" data-page="new">＋ Nouveau chat</button><button class="glass nav" data-page="temp">◷ Chat éphémère</button><button class="glass nav active" data-page="chat">◉ Chat IA</button><button class="glass nav" data-page="images">✧ Images IA</button><button class="glass nav" data-page="writing">✎ Rédaction</button><button class="glass nav" data-page="cv">▤ Créer un CV</button><button class="glass nav" data-page="youtube">▶ YouTube</button><button class="glass nav" data-page="plans">♢ Abonnements</button><div style="padding:12px 8px 0;font-size:11px;color:#bba3cc">Discussions récentes</div><div class="hist"></div><div class="bottom"><button class="glass nav" data-page="account">◉ Mon compte</button><button class="glass nav" data-page="settings">⚙ Paramètres</button></div></aside><main class="main"><div class="top">Chat IA</div><section class="content"></section><div class="composer"><form class="entry"><textarea placeholder="Pose une question à Chat IA…"></textarea><div class="actions"><button type="button" class="glass mic">🎙 Micro</button><button type="button" class="glass voice">◖)) Voix : off</button><button type="submit" class="glass send">↑</button></div></form><div class="status"></div></div></main></div><script>
(()=>{const content=document.querySelector('.content'),input=document.querySelector('textarea'),status=document.querySelector('.status');let page='chat',admin=false,temp=false,voice=false,serial=1,active=1,token=0;const chats=[{id:1,title:'Nouvelle discussion',messages:[]}],tempMessages=[],videos=[],promos=['BIENVENUE20'];const demo={online:18,Gratuit:124,Plus:32,Pro:12};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>chats.find(c=>c.id===active);const messages=()=>temp?tempMessages:current().messages;function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(temp&&page==='chat'?'temp':page)));document.querySelector('.hist').innerHTML=chats.map(c=>'<button data-chat="'+c.id+'">'+esc(c.title)+'</button>').join('')}function chat(){page='chat';const m=messages();content.innerHTML=m.length?'<div class="messages">'+m.map(x=>'<div class="bubble '+x.role+'">'+(x.role==='ai'?'Chat IA\n':'')+esc(x.text)+'</div>').join('')+'</div>':'<div class="welcome"><h1>Comment puis-je t’aider ?</h1><p class="muted">'+(temp?'Conversation éphémère non conservée.':'Ton assistant Chat IA.')+'</p><div class="suggest"><button class="glass" data-prompt="Aide-moi à rédiger un texte">✎ Rédiger</button><button class="glass" data-prompt="Donne-moi une idée">✧ Trouver une idée</button><button class="glass" data-prompt="Explique-moi un sujet">◎ Apprendre</button><button class="glass" data-prompt="Aide-moi à programmer">⌘ Programmer</button></div></div>';content.scrollTop=content.scrollHeight;nav()}function adminPage(){page='admin';nav();if(!admin){content.innerHTML='<h2>Accès administrateur</h2><p class="muted">Accès de démonstration uniquement.</p><div class="panel"><label><input type="checkbox" class="admin-check" style="width:auto"> Compte autorisé (simulation)</label><input class="admin-code" type="password" placeholder="Code administrateur"><button class="glass" data-act="login">Accéder</button><p class="note feedback"></p></div>';return}const total=demo.Gratuit+demo.Plus+demo.Pro;content.innerHTML='<h2>Tableau de bord administrateur</h2><p class="note">Données fictives — ne représentent pas des visiteurs réels.</p><div class="metrics"><div class="metric">Personnes en ligne<strong>'+demo.online+'</strong><span class="muted">Simulation</span></div><div class="metric">Utilisateurs inscrits<strong>'+total+'</strong></div><div class="metric">Abonnements payants<strong>'+(demo.Plus+demo.Pro)+'</strong></div><div class="metric">Revenu mensuel estimé<strong>'+(demo.Plus*9.99+demo.Pro*19.99).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+'</strong></div></div><div class="panel"><h3>Répartition des abonnements</h3>'+['Gratuit','Plus','Pro'].map(p=>'<div>'+p+' — '+demo[p]+'<div class="bar"><i style="width:'+(100*demo[p]/total)+'%"></i></div></div>').join('')+'</div><div class="panel"><h3>Ajouter une vidéo YouTube</h3><input class="video-title" placeholder="Titre de la vidéo"><input class="video-link" placeholder="Lien YouTube"><button class="glass" data-act="video">Publier</button><p class="note feedback">'+videos.length+' vidéo(s) dans cet aperçu</p></div><div class="panel"><h3>Codes promo</h3><p>'+promos.map(esc).join(' · ')+'</p><input class="promo" placeholder="Nouveau code"><button class="glass" data-act="promo">Ajouter</button></div><button class="glass" data-act="logout" style="padding:11px">Se déconnecter</button>'}function vidId(s){try{const u=new URL(s),h=u.hostname.replace(/^www\./,'');const id=h==='youtu.be'?u.pathname.split('/')[1]:h==='youtube.com'||h==='m.youtube.com'?u.searchParams.get('v')||u.pathname.split('/')[2]:null;return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}function show(p){page=p;temp=false;nav();if(p==='admin'){adminPage();return}if(p==='youtube'){content.innerHTML='<h2>YouTube</h2><p class="muted">Vidéos publiées depuis le panneau administrateur.</p>'+(videos.length?videos.map(v=>'<div class="panel"><b>'+esc(v.title)+'</b><p><a style="color:#dfb1ff" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v='+v.id+'">▶ Regarder la vidéo</a></p></div>').join(''):'<div class="panel">Aucune vidéo pour le moment.</div>');return}if(p==='plans'){content.innerHTML='<h2>Abonnements</h2>'+[['Gratuit','0 €'],['Plus','9,99 €'],['Pro','19,99 €']].map(x=>'<div class="panel"><b>'+x[0]+' — '+x[1]+'/mois</b><p><button class="glass" data-plan="'+x[0]+'">Choisir</button></p></div>').join('')+'<p class="note feedback">Paiements simulés.</p>';return}const names={images:'Images IA',writing:'Rédaction',cv:'Créer un CV',account:'Mon compte',settings:'Paramètres'};content.innerHTML='<h2>'+names[p]+'</h2><p class="muted">Fonctionnalité de démonstration.</p><div class="panel"><textarea style="width:100%;background:transparent;color:white;padding:12px" placeholder="Écris ici…"></textarea><p><button class="glass" data-act="demo">Tester</button></p><p class="note feedback"></p></div>'}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){const p=b.dataset.page;if(p==='new'){token++;temp=false;chats.unshift({id:++serial,title:'Nouvelle discussion',messages:[]});active=serial;chat()}else if(p==='temp'){token++;temp=true;tempMessages.length=0;chat()}else if(p==='chat'){temp=false;chat()}else show(p);return}if(b.dataset.chat){token++;temp=false;active=+b.dataset.chat;chat();return}if(b.dataset.prompt){input.value=b.dataset.prompt;input.focus();return}if(b.dataset.plan){content.querySelector('.feedback').textContent='Formule '+b.dataset.plan+' sélectionnée (simulation).';return}const a=b.dataset.act;if(a==='login'){if(content.querySelector('.admin-check').checked&&content.querySelector('.admin-code').value==='DEMO-ADMIN'){admin=true;adminPage()}else content.querySelector('.feedback').textContent='Code ou autorisation incorrect.'}else if(a==='logout'){admin=false;adminPage()}else if(a==='video'){const title=content.querySelector('.video-title').value.trim(),id=vidId(content.querySelector('.video-link').value.trim());if(title&&id){videos.unshift({title,id});adminPage()}else content.querySelector('.feedback').textContent='Titre ou lien YouTube invalide.'}else if(a==='promo'){const code=content.querySelector('.promo').value.trim().toUpperCase();if(code&&!promos.includes(code)){promos.push(code);adminPage()}}else if(a==='demo'){content.querySelector('.feedback').textContent='Démonstration 💜'}});document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const t=input.value.trim();if(!t)return;if(page!=='chat'){temp=false;chat()}const arr=messages(),id=++token;arr.push({role:'user',text:t});if(!temp&&arr.length===1)current().title=t.slice(0,30);input.value='';chat();status.textContent='Chat IA réfléchit…';const send=document.querySelector('.send');send.disabled=true;try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:arr.slice(-20)})});const data=await response.json();if(!response.ok)throw Error(data.error||'Erreur de connexion à l’IA.');if(id!==token)return;arr.push({role:'ai',text:data.reply});if(page==='chat'){chat();if(voice&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(data.reply);u.lang='fr-FR';speechSynthesis.speak(u)}}status.textContent='';}catch(err){if(id===token){arr.push({role:'ai',text:'⚠️ '+(err.message||'Impossible de contacter l’IA.')});if(page==='chat')chat();status.textContent='Vérifie la configuration de l’API.'}}finally{send.disabled=false}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('form').requestSubmit()}});document.addEventListener('pointermove',e=>{const el=e.target.closest('.glass,.bubble');if(el){const r=el.getBoundingClientRect();el.style.setProperty('--x',100*(e.clientX-r.left)/r.width+'%');el.style.setProperty('--y',100*(e.clientY-r.top)/r.height+'%')}});document.querySelector('.voice').addEventListener('click',e=>{voice=!voice;e.target.textContent='◖)) Voix : '+(voice?'on':'off');status.textContent=voice?'Lecture vocale activée.':'Lecture vocale désactivée.';if(!voice&&window.speechSynthesis)speechSynthesis.cancel()});document.querySelector('.mic').addEventListener('click',()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='Micro indisponible dans ce navigateur.';return}try{const r=new R();r.lang='fr-FR';r.onresult=e=>input.value+=(input.value?' ':'')+e.results[0][0].transcript;r.onerror=()=>status.textContent='Micro non autorisé.';r.start();status.textContent='Je t’écoute…'}catch{status.textContent='Micro indisponible.'}});window.addEventListener('hashchange',()=>{if(location.hash==='#admin')adminPage();else if(page==='admin')chat()});if(location.hash==='#admin')adminPage();else chat()})();
</script></body></html>
